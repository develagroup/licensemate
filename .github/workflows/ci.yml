name: RC1 checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: phase5-test-only
          POSTGRES_DB: licensepulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d licensepulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out source and history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Audit locked dependencies
        run: bun audit

      - name: Type check
        run: bun run lint

      - name: Apply disposable test schema
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:phase5-test-only@127.0.0.1:5432/licensepulse
          DATABASE_MIGRATION_URL: postgresql://postgres:phase5-test-only@127.0.0.1:5432/licensepulse
          DATABASE_RUNTIME_ROLE: postgres

      - name: Security smoke tests
        run: npm run test
        env:
          DATABASE_URL: postgresql://postgres:phase5-test-only@127.0.0.1:5432/licensepulse

      - name: Build production assets
        run: bun run build

      - name: Package versioned candidate
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          bundle_root="$(mktemp -d "$RUNNER_TEMP/licensepulse-source.XXXXXX")"
          git archive --format=tar HEAD | tar -xf - -C "$bundle_root"
          cp -a dist "$bundle_root/dist"
          release_root="$RUNNER_TEMP/licensepulse-release"
          mkdir -p "$release_root"
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='UTC 1970-01-01' -cf - -C "$bundle_root" . | gzip -n > "$release_root/licensepulse-${version}.tar.gz"
          sha256sum "$release_root/licensepulse-${version}.tar.gz" > "$release_root/licensepulse-${version}.tar.gz.sha256"

      - name: Upload versioned candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: licensepulse-1.0.0-rc.1
          path: ${{ runner.temp }}/licensepulse-release/licensepulse-1.0.0-rc.1.tar.gz*
          if-no-files-found: error
          retention-days: 30

      - name: Scan source and Git history for secrets
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          detect --source=/repo --redact --no-banner
